name: Automated AI Video Bot

on:
  schedule:
    - cron: '0 6,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai opencv-python-headless pillow beautifulsoup4 requests

      - name: Run Automation Script
        run: python main.py

              - name: Upload Generated Video
        uses: actions/upload-artifact@v4
        with:
          name: loot-video
          path: loot_reel.mp4

